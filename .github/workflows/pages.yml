name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Enter /dev/void metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          grep -Fq '<meta name="devvoid:post" content="1">' index.html
          grep -Fq '<meta name="devvoid:title"' index.html
          grep -Fq '<meta name="devvoid:summary"' index.html
          grep -Fq '<meta name="devvoid:published"' index.html
          grep -Fq '<meta name="devvoid:tags"' index.html
          grep -Fq '<meta name="devvoid:url" content="https://voidnullvalue.github.io/mirax-sample-analysis/">' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
